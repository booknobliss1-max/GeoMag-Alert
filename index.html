<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Domes & Dashboards · Space Weather Ambient Installation</title>

<style>

:root{
--bg1:#020617;
--bg2:#0f172a;
--text:#e5e7eb;
--muted:#94a3b8;
--accent:#38bdf8;
--panel:#020617cc;
--kp-low:#22c55e;
--kp-mid:#eab308;
--kp-high:#ef4444;
}

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:system-ui,sans-serif;
color:var(--text);
background:#000;
overflow:hidden;
}

#ambient-bg{
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 0%,#1e293b,#020617 60%,#000);
transition:all 2s ease;
z-index:-1;
}

.wrapper{
height:100vh;
display:flex;
flex-direction:column;
padding:16px;
gap:12px;
}

.header-title{
font-size:1.2rem;
font-weight:700;
color:var(--accent);
}

.header-sub{
font-size:.85rem;
color:var(--muted);
}

.main-grid{
flex:1;
display:grid;
grid-template-columns:2fr 1fr;
gap:12px;
overflow:hidden;
}

.panel{
background:var(--panel);
backdrop-filter:blur(12px);
border:1px solid #1f2937;
border-radius:16px;
padding:16px;
overflow:hidden;
display:flex;
flex-direction:column;
}

.heartbeat-ring{
width:180px;
height:180px;
border-radius:999px;
margin:auto;
position:relative;
display:grid;
place-items:center;
background:
radial-gradient(circle,#0b1120,#020617 70%,#000);
}

.heartbeat-pulse{
position:absolute;
width:180px;
height:180px;
border-radius:999px;
border:2px solid rgba(255,255,255,.1);
animation:pulse 4s infinite;
}

.heartbeat-core{
width:70px;
height:70px;
border-radius:999px;
background:
radial-gradient(circle,#f97316,#b91c1c,#020617);
}

@keyframes pulse{
0%,100%{
transform:scale(.9);
opacity:.4;
}
50%{
transform:scale(1.1);
opacity:1;
}
}

.kp-strip{
display:flex;
margin-top:10px;
}

.kp-bar{
height:16px;
width:100%;
background:#111827;
border-radius:999px;
overflow:hidden;
}

.kp-fill{
height:100%;
width:100%;
transform-origin:left;
transform:scaleX(0);
transition:all 1s ease;
}

.event-list{
overflow-y:auto;
max-height:180px;
font-size:.8rem;
}

.event-item{
padding:8px 0;
border-bottom:1px solid rgba(255,255,255,.08);
}

#journalList{
flex:1;
overflow-y:auto;
}

.button-row{
display:flex;
gap:8px;
margin-bottom:10px;
flex-wrap:wrap;
}

button{
background:#0f172a;
border:1px solid #334155;
color:white;
padding:8px 12px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#1e293b;
}

#alertBox{
position:fixed;
top:20px;
right:20px;
background:#b91c1c;
color:white;
padding:14px 18px;
border-radius:10px;
display:none;
z-index:9999;
font-weight:600;
box-shadow:0 10px 25px rgba(0,0,0,.5);
max-width:320px;
}

#incidentReport{
background:#111827;
border-radius:10px;
padding:12px;
margin-bottom:12px;
font-size:.85rem;
}

small{
color:var(--muted);
}

@media(max-width:900px){

body{
overflow:auto;
}

.main-grid{
grid-template-columns:1fr;
height:auto;
}

}

</style>
</head>

<body>

<div id="ambient-bg"></div>
<div id="alertBox"></div>

<div class="wrapper">

<header>
<div class="header-title">
Domes & Dashboards · Space Weather Ambient Installation
</div>

<div class="header-sub">
NASA DONKI + NOAA SWPC • Real-Time Civic Ambient Data Art
</div>
</header>

<main class="main-grid">

<section class="panel">

<div class="heartbeat-ring">
<div id="heartbeatPulse" class="heartbeat-pulse"></div>
<div class="heartbeat-core"></div>
</div>

<div id="heartbeatText" style="text-align:center;margin-top:12px;">
Loading solar activity...
</div>

<div id="flareMeta"
style="text-align:center;font-size:.8rem;color:var(--muted);margin-top:6px;">
</div>

<div style="margin-top:20px;">
Geomagnetic Field (Kp Index)
</div>

<div class="kp-strip">
<div class="kp-bar">
<div id="kpFill" class="kp-fill"></div>
</div>
</div>

<div id="kpText"
style="text-align:center;margin-top:8px;color:var(--muted);">
Loading Kp...
</div>

<div style="margin-top:20px;">
Recent Solar Events
</div>

<div id="eventList" class="event-list"></div>

</section>

<section class="panel">

<h3 style="margin-top:0;">
Space Weather Incident Report
</h3>

<div id="incidentReport">
No significant events recorded yet.
</div>

<div class="button-row">
<button onclick="clearJournal()">
Clear Journal
</button>

<button onclick="exportJournal()">
Export Journal
</button>
</div>

<h3 style="margin-top:8px;">
Space Weather Journal
</h3>

<div id="journalList"></div>

</section>

</main>

</div>

<script>

const NASA_API_KEY="DEMO_KEY";

let lastFlareClass=null;
let lastKp=null;

function showAlert(message){

addJournalEntry(message);

const box=document.getElementById("alertBox");

box.textContent=message;
box.style.display="block";

setTimeout(()=>{
box.style.display="none";
},12000);

}

function addJournalEntry(message){

const journal=
JSON.parse(
localStorage.getItem("spaceWeatherJournal") || "[]"
);

journal.unshift({
time:new Date().toLocaleString(),
message
});

const trimmed=journal.slice(0,500);

localStorage.setItem(
"spaceWeatherJournal",
JSON.stringify(trimmed)
);

renderJournal();

}

function renderJournal(){

const journal=
JSON.parse(
localStorage.getItem("spaceWeatherJournal") || "[]"
);

const container=
document.getElementById("journalList");

container.innerHTML=
journal.map(entry=>`

<div class="event-item">
<div>${entry.message}</div>
<small>${entry.time}</small>
</div>

`).join("");

}

function clearJournal(){

if(confirm("Clear journal?")){

localStorage.removeItem(
"spaceWeatherJournal"
);

renderJournal();

}

}

function exportJournal(){

const data=
localStorage.getItem(
"spaceWeatherJournal"
);

const blob=
new Blob([data],{
type:"application/json"
});

const url=
URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=url;
a.download="space-weather-journal.json";
a.click();

URL.revokeObjectURL(url);

}

function updateIncidentReport(title,details){

document.getElementById("incidentReport").innerHTML=`

<h4>${title}</h4>
<p>${details}</p>
<small>
${new Date().toLocaleString()}
</small>

`;

}

function setAmbient(level){

const bg=
document.getElementById("ambient-bg");

if(level==="storm"){

bg.style.background=
"radial-gradient(circle at 20% 0%,#7f1d1d,#020617 60%,#000)";

}
else if(level==="active"){

bg.style.background=
"radial-gradient(circle at 20% 0%,#115e59,#020617 60%,#000)";

}
else{

bg.style.background=
"radial-gradient(circle at 20% 0%,#1e293b,#020617 60%,#000)";

}

}

async function fetchSolarFlares(){

const start=
new Date(
Date.now()-3*24*60*60*1000
).toISOString().slice(0,10);

const url=
`https://api.nasa.gov/DONKI/FLR?startDate=${start}&api_key=${NASA_API_KEY}`;

try{

const res=await fetch(url);

const data=await res.json();

if(!data.length){

document.getElementById(
"heartbeatText"
).textContent="Sun is calm.";

return;

}

data.sort(
(a,b)=>
new Date(b.peakTime)-new Date(a.peakTime)
);

const flare=data[0];

const classType=
flare.classType || "Unknown";

document.getElementById(
"heartbeatText"
).textContent=
`Latest flare: ${classType}`;

document.getElementById(
"flareMeta"
).textContent=
`${new Date(flare.peakTime).toLocaleString()}`;

if(lastFlareClass!==classType){

addJournalEntry(
`Solar flare detected: ${classType}`
);

if(classType.startsWith("X")){

showAlert(
"⚠️ X-Class Solar Flare"
);

updateIncidentReport(
"Major Solar Flare",
`${classType} flare detected by NASA DONKI.`
);

setAmbient("storm");

}
else if(classType.startsWith("M")){

showAlert(
"⚠️ M-Class Solar Flare"
);

updateIncidentReport(
"Moderate Solar Flare",
`${classType} flare detected.`
);

setAmbient("active");

}

lastFlareClass=classType;

}

const list=
document.getElementById("eventList");

list.innerHTML="";

data.slice(0,10).forEach(event=>{

list.innerHTML+=`

<div class="event-item">
<strong>${event.classType}</strong>
<br>
<small>
${new Date(event.peakTime).toLocaleString()}
</small>
</div>

`;

});

}catch(err){

console.error(err);

}

}

async function fetchKp(){

try{

const res=await fetch(
"https://services.swpc.noaa.gov/json/planetary_k_index_1m.json"
);

const data=await res.json();

const latest=
data[data.length-1];

const kp=
Number(latest.kp_index);

const fill=
document.getElementById("kpFill");

fill.style.transform=
`scaleX(${kp/9})`;

fill.style.background=
kp>=6
? "var(--kp-high)"
: kp>=4
? "var(--kp-mid)"
: "var(--kp-low)";

document.getElementById(
"kpText"
).textContent=
`Kp ${kp}`;

if(lastKp!==kp){

if(kp>=6){

showAlert(
`⚠️ Geomagnetic Storm (Kp ${kp})`
);

updateIncidentReport(
"Geomagnetic Storm",
`Kp Index reached ${kp}.`
);

setAmbient("storm");

}

else if(kp>=4){

showAlert(
`⚠️ Active Geomagnetic Field (Kp ${kp})`
);

updateIncidentReport(
"Active Geomagnetic Conditions",
`Kp Index reached ${kp}.`
);

setAmbient("active");

}

addJournalEntry(
`Kp Index changed to ${kp}`
);

lastKp=kp;

}

}catch(err){

console.error(err);

}

}

renderJournal();

fetchSolarFlares();
fetchKp();

setInterval(fetchSolarFlares,600000);
setInterval(fetchKp,600000);

</script>

</body>
</html>
